[project]
name = "orders-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "polars>=2.1.0",
    "pydantic-ai-slim[openrouter]>=2.68.0",
    "pydantic-settings>=2.16.3",
    "sqlglot>=30.31.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
